<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZestTech | Order Checkout</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Light Header */
        header { 
            background: #ffffff; 
            padding: 16px 40px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid #e2e8f0; 
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .brand { font-size: 22px; font-weight: 800; color: #0f172a; text-decoration: none; }
        .brand span { color: #2563eb; }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .btn-shop-highlight {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff !important;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700 !important;
            font-size: 13px !important;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
            transition: transform 0.2s;
            white-space: nowrap;
        }
        .btn-shop-highlight:hover { transform: translateY(-2px); }
        .badge-asg { background: #ffffff; color: #b45309; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: 800; text-transform: uppercase; }

        .main-container { max-width: 650px; margin: 40px auto; padding: 0 20px; width: 100%; flex-grow: 1; }

        /* Checkout Card Form */
        .checkout-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            text-align: left;
        }

        .checkout-card h2 { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 6px; text-align: center; }
        .checkout-card p.subtext { font-size: 13px; color: #64748b; margin-bottom: 25px; text-align: center; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px 14px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; color: #0f172a; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; background: #ffffff; }

        .summary-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-title { font-size: 14px; font-weight: 700; color: #1e3a8a; }
        .summary-price { font-size: 18px; font-weight: 800; color: #2563eb; }

        .btn-submit { background: #10b981; color: #ffffff; border: none; padding: 14px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px; transition: background 0.2s; }
        .btn-submit:hover { background: #059669; }

        footer { background: #ffffff; border-top: 1px solid #e2e8f0; color: #64748b; text-align: center; padding: 25px; font-size: 12px; margin-top: 40px; }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .checkout-card { padding: 25px; }
        }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="index.html" class="brand">Zest<span>Tech</span></a>
        <div class="header-actions">
            <a href="shop.html" class="btn-shop-highlight">
                🛒 Back to Shop <span class="badge-asg">Catalogue</span>
            </a>
        </div>
    </header>

    <div class="main-container">
        <div class="checkout-card">
            <h2>Complete Order Settlement</h2>
            <p class="subtext">Enter customer details below to place order and log into Firestore database.</p>

            <form id="checkoutForm">
                <!-- Order Summary Display -->
                <div class="summary-box">
                    <div>
                        <div class="summary-title" id="displayItemName">Selected Item</div>
                        <span style="font-size: 11px; color: #64748b;">Cart Drawer Summary</span>
                    </div>
                    <div class="summary-price" id="displayPrice">0 NGN</div>
                </div>

                <div class="form-group">
                    <label for="item_name">Item Title</label>
                    <input type="text" id="item_name" readonly style="background: #e2e8f0; font-weight: 700; color: #1e293b;">
                </div>

                <div class="form-group">
                    <label for="customer_name">Full Name</label>
                    <input type="text" id="customer_name" placeholder="e.g. Miracle Benjamin" required>
                </div>

                <div class="form-group">
                    <label for="customer_email">Email Address</label>
                    <input type="email" id="customer_email" placeholder="e.g. benjaminmiracle332@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="delivery_location">Delivery Address</label>
                    <input type="text" id="delivery_location" placeholder="e.g. Ikot Akpaden, AKSU Main Campus" required>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Confirm Order & Save to Database</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 ZestTech Retail Labs. Specialized Gadget Accessories Framework. (AK22/PHS/CSC/013)
    </footer>

    <script>
        // 1. Firebase Project Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyBfJ-XqJAB7TaxZ5UplezyWcoeCcu0L1J0",
            authDomain: "zestmarket-portfolio.firebaseapp.com",
            projectId: "zestmarket-portfolio",
            storageBucket: "zestmarket-portfolio.appspot.com",
            messagingSenderId: "1028308821901",
            appId: "1:1028308821901:web:e2b00f8983995f70a1a361"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Retrieve Selected Cart Data from LocalStorage
        const selectedItem = localStorage.getItem('cart_item') || '65W USB-C PC Laptop Power Charger';
        const selectedPrice = localStorage.getItem('cart_price') || '26000';
        const formattedPrice = parseInt(selectedPrice).toLocaleString() + ' NGN';

        document.getElementById('item_name').value = selectedItem;
        document.getElementById('displayItemName').textContent = selectedItem;
        document.getElementById('displayPrice').textContent = formattedPrice;

        // 3. Form Submission Handler
        document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Processing Order...';

            const name = document.getElementById('customer_name').value.trim();
            const email = document.getElementById('customer_email').value.trim();
            const location = document.getElementById('delivery_location').value.trim();
            const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);

            try {
                // Log to 'zestmarket_orders' collection in Firebase
                await db.collection('zestmarket_orders').add({
                    order_id: orderId,
                    customer_name: name,
                    customer_email: email,
                    delivery_location: location,
                    item_name: selectedItem,
                    amount_paid: formattedPrice,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    timestamp: new Date().toLocaleString()
                });

                alert(`Order ${orderId} successfully logged to database!`);
                window.location.href = 'shop.html';
            } catch (err) {
                console.error(err);
                alert('Order submission failed. Check network connection.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Confirm Order & Save to Database';
            }
        });
    </script>
</body>
</html>
